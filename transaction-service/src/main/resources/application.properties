# ==============================================
# TRANSACTION SERVICE â€” Configuration
# ==============================================
spring.application.name=transaction-service
server.port=8083

# ==============================================
# BASE DE DONNÃ‰ES
# ==============================================
spring.datasource.url=jdbc:mysql://db-transactions:3306/transactions_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================
# KAFKA
# ==============================================
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ==============================================
# JWT
# ==============================================
jwt.secret=QmFucXVlUGxhdGZvcm1lU2VjcmV0S2V5Rm9ySldUVmFsaWRhdGlvbjIwMjZZYW91bmRlVW5pdmVyc2l0eQ==

# ==============================================
# SWAGGER
# ==============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================================
# LOGS
# ==============================================
logging.level.com.banque.transaction=DEBUG


# Eureka
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
