# ==============================================
# IDENTITY SERVICE — Configuration
# ==============================================
spring.application.name=identity-service
server.port=8081

# ==============================================
# BASE DE DONNÉES
# ==============================================
spring.datasource.url=jdbc:mysql://db-identity:3306/identity_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================
# JWT
# ==============================================
jwt.secret=BanquePlatformeSecretKeyForJWTValidation2026YaoundeUniversity
# Token valide 24h (en millisecondes)
jwt.expiration=86400000
# Refresh token valide 7 jours
jwt.refresh-expiration=604800000

# ==============================================
# KAFKA
# ==============================================
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ==============================================
# SWAGGER
# ==============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================================
# LOGS
# ==============================================
logging.level.com.banque.identity=DEBUG
logging.level.org.springframework.security=INFO
