spring.application.name=identity-service
server.port=8081

# Base de donnees MySQL
spring.datasource.url=jdbc:mysql://db-identity:3306/identity_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT — cle en hexadecimal 64 chars (32 bytes = 256 bits)
jwt.secret=42616e7175655365637265744b657946b6f724a575456616c69646174696f6e32
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000

# Kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# Eureka
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
eureka.instance.prefer-ip-address=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logs
logging.level.com.bankapp.identity=DEBUG
logging.level.org.springframework.security=INFO
