server:
  port: 8080

spring:
  application:
    name: api-gateway

  # Redis pour le rate limiting
  data:
    redis:
      host: redis
      port: 6379

  # Sécurité JWT — même clé hex que l'identity-service
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: 42616e7175655365637265744b65794662616e71756553656372657432303236

  # Routes de la gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:

        # ── Identity Service ──────────────────────────────────────────
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

        # ── Customer Service ──────────────────────────────────────────
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**
          filters:
            - name: CircuitBreaker
              args:
                name: customerCircuitBreaker
                fallbackUri: forward:/fallback/customers
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        # ── Account Service ───────────────────────────────────────────
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
          filters:
            - name: CircuitBreaker
              args:
                name: accountCircuitBreaker
                fallbackUri: forward:/fallback/accounts
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        # ── Transaction Service ───────────────────────────────────────
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
          filters:
            - name: CircuitBreaker
              args:
                name: transactionCircuitBreaker
                fallbackUri: forward:/fallback/transactions
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1

        # ── Loan Service ──────────────────────────────────────────────
        - id: loan-service
          uri: lb://loan-service
          predicates:
            - Path=/api/loans/**
          filters:
            - name: CircuitBreaker
              args:
                name: loanCircuitBreaker
                fallbackUri: forward:/fallback/loans
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        # ── Operator Service ──────────────────────────────────────────
        - id: operator-service
          uri: lb://operator-service
          predicates:
            - Path=/api/operators/**
          filters:
            - name: CircuitBreaker
              args:
                name: operatorCircuitBreaker
                fallbackUri: forward:/fallback/operators

        # ── Document Service ──────────────────────────────────────────
        - id: document-service
          uri: lb://document-service
          predicates:
            - Path=/api/documents/**
          filters:
            - name: CircuitBreaker
              args:
                name: documentCircuitBreaker
                fallbackUri: forward:/fallback/documents
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

        # ── Notification Service ──────────────────────────────────────
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        # ── Reporting Service ─────────────────────────────────────────
        - id: reporting-service
          uri: lb://reporting-service
          predicates:
            - Path=/api/reports/**
          filters:
            - name: CircuitBreaker
              args:
                name: reportingCircuitBreaker
                fallbackUri: forward:/fallback/reports

        # ── OCR Service ───────────────────────────────────────────────
        - id: ocr-service
          uri: lb://ocr-service
          predicates:
            - Path=/api/ocr/**
          filters:
            - name: CircuitBreaker
              args:
                name: ocrCircuitBreaker
                fallbackUri: forward:/fallback/ocr
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

        # ── Audit Service ─────────────────────────────────────────────
        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/api/audit/**

# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always

# Logs
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
