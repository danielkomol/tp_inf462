server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: redis
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          secret: 42616e7175655365637265744b65794662616e71756553656372657432303236

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:

        # ── Identity Service ──────────────────────────────────────────
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**

        # ── Customer Service ──────────────────────────────────────────
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**

        # ── Account Service ───────────────────────────────────────────
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/v1/accounts/**

        # ── Transaction Service ───────────────────────────────────────
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/v1/transactions/**

        # ── Loan Service ──────────────────────────────────────────────
        - id: loan-service
          uri: lb://loan-service
          predicates:
            - Path=/api/v1/loans/**

        # ── Operator Service ──────────────────────────────────────────
        - id: operator-service
          uri: lb://operator-service
          predicates:
            - Path=/api/v1/operators/**

        # ── Document Service ──────────────────────────────────────────
        - id: document-service
          uri: http://document-service:8085
          predicates:
            - Path=/api/v1/documents/**

        # ── OCR Service ───────────────────────────────────────────────
        - id: ocr-service
          uri: http://ocr-service:8000
          predicates:
            - Path=/api/v1/ocr/**

        # ── Audit Service ─────────────────────────────────────────────
        - id: audit-service
          uri: http://audit-service:8087
          predicates:
            - Path=/api/v1/audit/**

        # ── Reporting Service ─────────────────────────────────────────
        - id: reporting-service
          uri: http://reporting-service:8088
          predicates:
            - Path=/api/v1/reports/**

        # ── Notification Service ──────────────────────────────────────
        - id: notification-service
          uri: http://notification-service:3000
          predicates:
            - Path=/api/v1/notifications/**

# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
